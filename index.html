<!DOCTYPE html>
<html>
<body>

<h2>Guess the location</h2>

<input id="word" type="text">
<button onclick="checkWord()">Submit</button>

<p id="message"></p>

<script>
function checkWord() {
  let answer = document.getElementById("word").value
    .toLowerCase()
    .trim();

  if (
    answer.includes("museum") ||
    answer.includes("collection")
  ) {
    document.getElementById("message").innerHTML =
      "Morrill Science Center II, Room 146";
  } else {
    document.getElementById("message").innerHTML =
      "Try again";
  }
}
</script>

</body>
</html>
