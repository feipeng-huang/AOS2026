<!DOCTYPE html>
<html>
<body>

<h2>Enter the secret word</h2>

<input id="word" type="text">
<button onclick="checkWord()">Submit</button>

<p id="message"></p>

<script>
function checkWord() {
  let answer = document.getElementById("word").value;

  if (answer.toLowerCase() === "UMass Natural History Collections") {
    document.getElementById("message").innerHTML =
      "Morrill Science Center II, Room 146";
  } else {
    document.getElementById("message").innerHTML =
      "Wrong word. Try again.";
  }
}
</script>

</body>
</html>
